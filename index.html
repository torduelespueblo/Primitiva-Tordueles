    <script>
      // Prevent @vite/client from attempting HMR WebSocket connections in AI Studio iframe
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || (typeof url === 'string' && url.indexOf('vite-hmr') !== -1)) {
              return {
                readyState: 3, // CLOSED
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      })();

      // Suppress harmless Vite HMR WebSocket connection closed notices in embedded iframe preview
      window.addEventListener('error', function (event) {
        if (event && event.message && event.message.includes('WebSocket closed without opened')) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && String(event.reason).includes('WebSocket closed without opened')) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
    </script>

    <!-- CSS Crítico de Splash Screen Nativa (renderizado instantáneo sin parpadeos) -->
    <style id="splash-critical-css">
      html.splash-locked,
      body.splash-locked {
        overflow: hidden !important;
        height: 100% !important;
        overscroll-behavior: none !important;
        touch-action: none !important;
      }

      #pwa-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        width: 100%;
        height: 100dvh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #0A2540;
        background-image:
          radial-gradient(circle at 50% 48%, rgba(26, 77, 128, 0.45) 0%, rgba(10, 37, 64, 0.92) 38%, #0A2540 62%, #051628 100%);
        pointer-events: all;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
        transition:
          opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.55s ease,
          transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #pwa-splash-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.035);
      }

      .splash-logo-stage {
        position: relative;
        width: clamp(230px, 60vw, 340px);
        height: clamp(230px, 60vw, 340px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splashEmblemReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .splash-logo-stage::before {
        content: "";
        position: absolute;
        inset: -14%;
        border-radius: 50%;
        background: radial-gradient(
          circle at center,
          rgba(255, 107, 0, 0.14) 0%,
          rgba(22, 65, 108, 0.28) 44%,
          rgba(10, 37, 64, 0) 74%
        );
        pointer-events: none;
      }

      .splash-logo-img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border: 0;
        border-radius: 50%;
        /* Difuminado radial sobre los bordes del logo para fusión invisible con #0A2540 */
        -webkit-mask-image: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 1) 54%,
          rgba(0, 0, 0, 0.88) 68%,
          rgba(0, 0, 0, 0.32) 84%,
          rgba(0, 0, 0, 0) 98%
        );
        mask-image: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 1) 54%,
          rgba(0, 0, 0, 0.88) 68%,
          rgba(0, 0, 0, 0.32) 84%,
          rgba(0, 0, 0, 0) 98%
        );
      }

      @keyframes splashEmblemReveal {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body class="bg-[#F4F6F9] text-slate-900 antialiased selection:bg-[#0A2540] selection:text-white splash-locked">
    <!-- SPLASH SCREEN NATIVA (2000ms exactos + bloqueo de scroll/interacción) -->
    <div id="pwa-splash-screen" role="status" aria-live="polite" aria-label="Iniciando Peña Primitiva Tordueles">
      <div class="splash-logo-stage">
        <img
          src="./pwa-maskable-512x512.png"
          alt="Logotipo oficial Peña Primitiva Tordueles"
          class="splash-logo-img"
          width="512"
          height="512"
          decoding="sync"
          fetchpriority="high"
        />
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        var SPLASH_DURATION_MS = 2000;
        var splash = document.getElementById('pwa-splash-screen');
        var htmlEl = document.documentElement;
        var bodyEl = document.body;

        window.setTimeout(function () {
          htmlEl.classList.remove('splash-locked');
          if (bodyEl) {
            bodyEl.classList.remove('splash-locked');
          }

          if (!splash) return;
          splash.classList.add('is-hidden');
          splash.setAttribute('aria-hidden', 'true');

          window.setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 600);
        }, SPLASH_DURATION_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
