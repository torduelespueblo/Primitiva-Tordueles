<script>
  /**
   * ==========================================================================
   * PEÑA PRIMITIVA TORDUELES - CONTROLADOR FRONTEND SPA (JavaScript Puro)
   * Archivo: Logica.html
   * ==========================================================================
   * Cumplimiento estricto RGPD: no contiene datos sensibles ni credenciales.
   */

  const ESTADO_APP = {
    usuario: null,
    adminPassword: ''
  };

  (function initSplashScreen() {
    var SPLASH_DURATION_MS = 2000;
    window.setTimeout(function () {
      document.documentElement.classList.remove('splash-locked');
      if (document.body) {
        document.body.classList.remove('splash-locked');
      }
      var splash = document.getElementById('pwaSplashScreen');
      if (!splash) return;
      splash.classList.add('is-hidden');
      splash.setAttribute('aria-hidden', 'true');
      window.setTimeout(function () {
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 600);
    }, SPLASH_DURATION_MS);
  })();

  function cambiarVista(viewId) {
    document.querySelectorAll('.view-section').forEach(function (sec) {
      sec.classList.remove('active');
    });
    const destino = document.getElementById(viewId);
    if (destino) {
      destino.classList.add('active');
    }

    const btnSalir = document.getElementById('btnCerrarSesion');
    if (btnSalir) {
      btnSalir.style.display = (viewId === 'viewDashboard' || viewId === 'viewAdminPanel') ? 'inline-flex' : 'none';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function mostrarCargando(activo, texto) {
    const overlay = document.getElementById('loadingOverlay');
    const lbl = document.getElementById('loadingMessage');
    if (lbl && texto) lbl.innerText = texto;
    if (overlay) {
      if (activo) overlay.classList.add('active');
      else overlay.classList.remove('active');
    }
  }

  function mostrarToast(mensaje, tipo) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const item = document.createElement('div');
    item.className = 'toast-item' + (tipo ? ' ' + tipo : '');
    item.innerText = mensaje;
    container.appendChild(item);
    setTimeout(function () {
      if (item.parentNode) item.parentNode.removeChild(item);
    }, 4500);
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatearMoneda(valor) {
    const num = parseFloat(valor) || 0;
    return num.toLocaleString('es-ES', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + ' €';
  }

  function tieneAppsScript() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  // ==========================================================================
  // 1. MÓDULO 1: PANTALLA DUAL (LOGIN / TRANSICIÓN FLUIDA A REGISTRO)
  // ==========================================================================

  function handleLoginSubmit(event) {
    if (event) event.preventDefault();
    const input = document.getElementById('inputUserDni');
    const dni = (input ? input.value : '').trim().toUpperCase().replace(/[\s-]/g, '');

    if (!dni) {
      mostrarToast('Introduce tu DNI o NIE para acceder.', 'error');
      return;
    }

    mostrarCargando(true, 'Comprobando tu DNI o NIE en la base de datos...');

    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.user) {
            ESTADO_APP.usuario = res.user;
            cargarDashboardCompleto(res.user.dni);
          } else if (res && res.baja) {
            mostrarCargando(false);
            mostrarToast(res.message || 'Usuario en estado de baja.', 'error');
          } else {
            mostrarCargando(false);
            abrirFormularioRegistro();
          }
        })
        .withFailureHandler(function (err) {
          mostrarCargando(false);
          mostrarToast('Error de conexión: ' + (err.message || err), 'error');
        })
        .validarLoginDNI(dni);
      return;
    }

    setTimeout(function () {
      mostrarCargando(false);
      abrirFormularioRegistro();
    }, 300);
  }

  function abrirFormularioRegistro() {
    cambiarVista('viewRegister');
    validarFormularioRegistro();
  }

  function volverALogin() {
    cambiarVista('viewLogin');
    const input = document.getElementById('inputUserDni');
    if (input) {
      input.focus();
      input.select();
    }
  }

  function validarFormularioRegistro() {
    const nombre = (document.getElementById('regNombre')?.value || '').trim();
    const apellidos = (document.getElementById('regApellidos')?.value || '').trim();
    const telefono = (document.getElementById('regTelefono')?.value || '').trim();
    const chk = document.getElementById('chkAcceptRules');
    const btn = document.getElementById('btnSubmitRegistro');
    if (btn) {
      btn.disabled = !(nombre.length > 0 && apellidos.length > 0 && telefono.length >= 6 && chk && chk.checked);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    ['regNombre', 'regApellidos', 'regTelefono'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', validarFormularioRegistro);
    });
  });

  function handleRegisterSubmit(event) {
    if (event) event.preventDefault();
    const nombre = document.getElementById('regNombre').value.trim();
    const apellidos = document.getElementById('regApellidos').value.trim();
    const telefono = document.getElementById('regTelefono').value.trim();
    const aceptado = document.getElementById('chkAcceptRules').checked;

    if (!aceptado) {
      mostrarToast('Debes aceptar el Reglamento Oficial para continuar.', 'error');
      return;
    }

    const datos = {
      nombre: nombre,
      apellidos: apellidos,
      telefono: telefono,
      reglamentoAceptado: true
    };

    mostrarCargando(true, 'Registrando alta con sello temporal de milisegundos...');

    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (res) {
          mostrarCargando(false);
          if (res && res.success) {
            ESTADO_APP.usuario = res.user;
            mostrarToast('Alta completada como Suplente #' + res.posicionEspera + ' (' + res.timestamp + ').', 'success');
            cargarDashboardCompleto('');
          } else {
            mostrarToast((res && res.message) || 'No se pudo completar el registro.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          mostrarCargando(false);
          mostrarToast('Error en el servidor: ' + (err.message || err), 'error');
        })
        .registrarNuevoJugadorDesdeWeb(datos);
      return;
    }

    setTimeout(function () {
      mostrarCargando(false);
      mostrarToast('El alta requiere conexión activa con el servidor de Google Apps Script.', 'error');
    }, 250);
  }

  // ==========================================================================
  // 2. MÓDULO 2: GENERACIÓN DE PDF PROFESIONAL (html2pdf.js) Y REGLAMENTO HTML
  // ==========================================================================

  function descargarReglamentoPDF() {
    const sourceRules = document.getElementById('rulesScrollContainer');
    if (!sourceRules) return;

    const jspdfLib = window.jspdf && window.jspdf.jsPDF;
    if (!jspdfLib) {
      mostrarToast('No se pudo cargar el generador PDF. Usa el enlace HTML inferior.', 'error');
      return;
    }

    try {
      const doc = new jspdfLib({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 16;
      const contentWidth = pageWidth - marginX * 2;
      const bottomLimit = pageHeight - 18;

      doc.setFillColor(10, 37, 64);
      doc.rect(0, 0, pageWidth, 32, 'F');
      doc.setFillColor(255, 107, 0);
      doc.rect(0, 32, pageWidth, 1.8, 'F');

      doc.setTextColor(255, 107, 0);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.text('DOCUMENTO OFICIAL VINCULANTE', marginX, 11);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(15.5);
      doc.text('Peña La Primitiva Tordueles', marginX, 19);

      doc.setTextColor(226, 232, 240);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text('Reglamento Oficial de la Peña Primitiva Tordueles · Tordueles (Burgos)', marginX, 26.5);

      let y = 43;
      const ensureSpace = function (h) {
        if (y + h > bottomLimit) {
          doc.addPage();
          y = 18;
        }
      };

      const nodes = sourceRules.querySelectorAll('h4, p, li');
      nodes.forEach(function (el) {
        const tag = el.tagName.toUpperCase();
        const txt = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
        if (!txt) return;

        if (tag === 'H4') {
          ensureSpace(16);
          y += 3;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11.5);
          doc.setTextColor(10, 37, 64);
          const lines = doc.splitTextToSize(txt, contentWidth);
          doc.text(lines, marginX, y);
          y += lines.length * 5.4 + 2;
        } else {
          const isBullet = el.closest('.rules-table-box') !== null;
          const prefix = isBullet ? '•  ' : '';
          const indent = isBullet ? 5 : 0;
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(isBullet ? 9.5 : 10);
          doc.setTextColor(30, 41, 59);
          const lines = doc.splitTextToSize(prefix + txt, contentWidth - indent);
          lines.forEach(function (line) {
            ensureSpace(6);
            doc.text(line, marginX + indent, y);
            y += 4.8;
          });
          y += 2;
        }
      });

      const totalPages = doc.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(100, 116, 139);
        doc.text('Peña La Primitiva Tordueles · Reglamento Oficial', marginX, pageHeight - 8);
        doc.text('Página ' + p + ' de ' + totalPages, pageWidth - marginX, pageHeight - 8, { align: 'right' });
      }

      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Reglamento_Oficial_Pena_Primitiva_Tordueles.pdf';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2000);
      mostrarToast('Reglamento descargado en PDF (' + totalPages + ' páginas).', 'success');
    } catch (err) {
      mostrarToast('Error al generar el PDF: ' + (err.message || err), 'error');
    }
  }

  function abrirModalReglamentoHtml(event) {
    if (event) event.preventDefault();
    const source = document.getElementById('rulesScrollContainer');
    const modalBody = document.getElementById('htmlRulesModalBody');
    const modal = document.getElementById('htmlRulesModal');
    if (source && modalBody && modal) {
      modalBody.innerHTML = source.innerHTML;
      modal.classList.add('active');
    }
  }

  function cerrarModalReglamentoHtml() {
    const modal = document.getElementById('htmlRulesModal');
    if (modal) modal.classList.remove('active');
  }

  // ==========================================================================
  // 3. MÓDULO 3 & 5: DASHBOARD, BANNER NARANJA Y CENSO PÚBLICO RGPD
  // ==========================================================================

  function cargarDashboardCompleto(dni) {
    mostrarCargando(true, 'Cargando datos oficiales de la peña...');

    if (!tieneAppsScript()) {
      mostrarCargando(false);
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (!res || !res.success) {
          mostrarToast((res && res.message) || 'No se pudieron cargar los datos.', 'error');
          return;
        }
        if (res.data.usuario) {
          ESTADO_APP.usuario = res.data.usuario;
        }
        renderizarDashboard(res.data);
        cambiarVista('viewDashboard');
        cargarBannerRenovacion();
        cargarListaPublicaJugadores();
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al cargar dashboard: ' + (err.message || err), 'error');
      })
      .obtenerDatosDashboard(dni);
  }

  function renderizarDashboard(data) {
    const user = ESTADO_APP.usuario || {};
    const tes = data.tesoreria || {};
    const jInfo = data.jornadaInfo || {};

    document.getElementById('dashBolsaPremios').innerText = formatearMoneda(tes.bolsaPremios);
    document.getElementById('dashNombreUsuario').innerText = user.nombreCompleto || 'Socio en Alta';
    document.getElementById('dashDniUsuario').innerText = user.dni ? ('DNI: ' + user.dni) : 'Pendiente de asignación de DNI';
    document.getElementById('dashCondicion').innerText = user.estado || 'Suplente';
    document.getElementById('dashPago').innerText = user.estadoPago || user.pago || 'Pendiente';
    document.getElementById('dashCiclo').innerText = 'Ciclo ' + (jInfo.cicloActual || user.cicloActual || 1) + ' · J' + (jInfo.jornadaEnCiclo || 1);
    document.getElementById('dashParticipacion').innerText = user.porcentajeParticipacion || '0.00%';

    const btnWa = document.getElementById('btnWhatsappRenovacion');
    if (btnWa) {
      const msg = encodeURIComponent(
        'Peña Primitiva Tordueles - Confirmo el abono de renovación de 10 € (Ciclo ' +
        (jInfo.cicloActual || 1) + '). Socio: ' + (user.nombreCompleto || 'Nuevo Socio')
      );
      btnWa.href = 'https://api.whatsapp.com/send?text=' + msg;
    }

    const cardBoleto = document.getElementById('cardApuestaActiva');
    const sorteo = data.ultimoSorteo;
    if (cardBoleto && sorteo && sorteo.combinacionJugada) {
      cardBoleto.style.display = 'block';
      document.getElementById('dashJornadaBoleto').innerText = 'Jornada ' + sorteo.jornada + ' · ' + sorteo.fecha;
      document.getElementById('dashBoletoMeta').innerText = 'Importe jugado: ' + formatearMoneda(sorteo.importeJugado);
      const ballsWrap = document.getElementById('dashBolasContainer');
      ballsWrap.innerHTML = '';
      sorteo.combinacionJugada.split(',').map(function (n) { return n.trim(); }).filter(Boolean).forEach(function (num) {
        const div = document.createElement('div');
        div.className = 'ball tabular-nums';
        div.innerText = num.length === 1 ? '0' + num : num;
        ballsWrap.appendChild(div);
      });
    } else if (cardBoleto) {
      cardBoleto.style.display = 'none';
    }
  }

  function cargarBannerRenovacion() {
    const banner = document.getElementById('renewalOrangeBanner');
    const txt = document.getElementById('renewalBannerText');
    if (!banner || !txt) return;

    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (info) {
          if (info && info.esPeriodoRenovacion) {
            txt.innerText = 'Periodo de Renovación Activo: Jornada ' + info.jornadaEnCiclo + '/10. Recuerda abonar la cuota de 10€ antes de finalizar la jornada 9.';
            banner.classList.add('visible');
          } else {
            banner.classList.remove('visible');
          }
        })
        .withFailureHandler(function () {
          banner.classList.remove('visible');
        })
        .obtenerJornadaActual();
      return;
    }

    banner.classList.remove('visible');
  }

  function cargarListaPublicaJugadores() {
    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (lista) {
          renderizarTablaPublica(lista || []);
        })
        .withFailureHandler(function () {
          renderizarTablaPublica([]);
        })
        .obtenerListaJugadoresPublica();
      return;
    }
    renderizarTablaPublica([]);
  }

  function renderizarTablaPublica(lista) {
    const tbody = document.getElementById('publicPlayersBody');
    const countLbl = document.getElementById('publicCountText');
    if (!tbody) return;

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 18px; color: var(--text-muted);">No hay jugadores registrados.</td></tr>';
      if (countLbl) countLbl.innerText = '0 socios';
      return;
    }

    const titulares = lista.filter(function (j) { return j.estado === 'Titular'; }).length;
    if (countLbl) {
      countLbl.innerText = titulares + ' Titulares · ' + (lista.length - titulares) + ' Suplentes';
    }

    tbody.innerHTML = lista.map(function (j, idx) {
      const esTitular = j.estado === 'Titular';
      return (
        '<tr>' +
          '<td class="tabular-nums" style="color: var(--text-muted); font-weight: 700;">' + (j.id || idx + 1) + '</td>' +
          '<td style="font-weight: 700; color: var(--navy-deep);">' + escapeHtml(j.nombre) + '</td>' +
          '<td style="font-weight: 600;">' + escapeHtml(j.apellidos) + '</td>' +
          '<td><span class="' + (esTitular ? 'state-text-titular' : 'state-text-suplente') + '">' + (esTitular ? 'Titular' : 'Suplente') + '</span></td>' +
        '</tr>'
      );
    }).join('');
  }

  // ==========================================================================
  // 4. MÓDULO 4: PANEL DE ADMINISTRADOR PROTEGIDO
  // ==========================================================================

  function abrirModalAdmin() {
    const modal = document.getElementById('adminAuthModal');
    const input = document.getElementById('inputAdminPassword');
    if (modal) modal.classList.add('active');
    if (input) {
      input.value = '';
      input.focus();
    }
  }

  function cerrarModalAdmin() {
    const modal = document.getElementById('adminAuthModal');
    if (modal) modal.classList.remove('active');
  }

  function validarAccesoAdmin(event) {
    if (event) event.preventDefault();
    const pass = (document.getElementById('inputAdminPassword')?.value || '').trim();
    if (!pass) {
      mostrarToast('Introduce la contraseña de administrador.', 'error');
      return;
    }

    if (!tieneAppsScript()) {
      mostrarToast('El Panel Admin requiere la WebApp desplegada en Google Apps Script para validar credenciales en servidor.', 'error');
      return;
    }

    mostrarCargando(true, 'Verificando credenciales de administración...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          ESTADO_APP.adminPassword = pass;
          cerrarModalAdmin();
          cambiarVista('viewAdminPanel');
          renderizarTablaAdmin(res.jugadores || []);
          cargarEscrutinioDelCiclo();
        } else {
          mostrarToast((res && res.error) || 'Contraseña incorrecta.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al autenticar: ' + (err.message || err), 'error');
      })
      .obtenerListaJugadoresAdmin(pass);
  }

  function recargarListaAdmin() {
    if (!ESTADO_APP.adminPassword || !tieneAppsScript()) return;
    mostrarCargando(true, 'Actualizando censo completo...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          renderizarTablaAdmin(res.jugadores || []);
        }
      })
      .withFailureHandler(function () {
        mostrarCargando(false);
      })
      .obtenerListaJugadoresAdmin(ESTADO_APP.adminPassword);
  }

  function parsearTimestampAdmin(ts, tsMs) {
    if (typeof tsMs === 'number' && !isNaN(tsMs)) return tsMs;
    if (!ts) return Number.MAX_SAFE_INTEGER;
    const str = String(ts).trim();
    const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))?/);
    if (m) {
      const ms = m[7] ? parseInt((m[7] + '000').slice(0, 3), 10) : 0;
      return new Date(
        parseInt(m[3], 10),
        parseInt(m[2], 10) - 1,
        parseInt(m[1], 10),
        parseInt(m[4], 10),
        parseInt(m[5], 10),
        parseInt(m[6], 10),
        ms
      ).getTime();
    }
    const parsed = Date.parse(str);
    return isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
  }

  function normalizarEstadoSocio(rawEstado) {
    const up = String(rawEstado || '').trim().toUpperCase();
    if (up === 'TITULAR') return 'TITULAR';
    if (up.indexOf('BAJA') !== -1) return 'BAJA';
    return 'SUPLENTE';
  }

  function construirFilaTablaAdmin(j, incluirTimestamp) {
    const esPagado = String(j.pago || '').trim().toLowerCase() === 'pagado';
    const siguienteEstado = esPagado ? 'Pendiente' : 'Pagado';
    const tsCol = incluirTimestamp
      ? '<td class="tabular-nums" style="font-size: 0.78rem; color: var(--text-muted); white-space: nowrap;">' + escapeHtml(j.timestamp || '—') + '</td>'
      : '';

    return (
      '<tr>' +
        tsCol +
        '<td style="font-weight: 700; color: var(--navy-deep);">' + escapeHtml(j.nombre || '—') + '</td>' +
        '<td style="font-weight: 600;">' + escapeHtml(j.apellidos || '—') + '</td>' +
        '<td class="tabular-nums">' + escapeHtml(j.dni || '—') + '</td>' +
        '<td class="tabular-nums">' + escapeHtml(j.telefono || '—') + '</td>' +
        '<td class="tabular-nums" style="font-size: 0.78rem;">' + escapeHtml(j.iban || '—') + '</td>' +
        '<td>' +
          '<button type="button" class="btn-toggle-pago ' + (esPagado ? 'pagado' : 'pendiente') + '" onclick="cambiarEstadoPagoAdmin(' + j.fila + ', \'' + siguienteEstado + '\')">' +
            (esPagado ? 'Pagado' : 'Pendiente') +
          '</button>' +
        '</td>' +
      '</tr>'
    );
  }

  function renderizarTablaAdmin(jugadores) {
    const tbodyTitulares = document.getElementById('adminTitularesBody');
    const tbodySuplentes = document.getElementById('adminSuplentesBody');
    const tbodyBajas = document.getElementById('adminBajasBody');
    if (!tbodyTitulares || !tbodySuplentes || !tbodyBajas) return;

    const lista = Array.isArray(jugadores) ? jugadores : [];
    const titulares = [];
    const suplentes = [];
    const bajas = [];

    lista.forEach(function (j) {
      const cat = normalizarEstadoSocio(j.estado);
      if (cat === 'TITULAR') titulares.push(j);
      else if (cat === 'BAJA') bajas.push(j);
      else suplentes.push(j);
    });

    // Ordenar estrictamente los Suplentes por su marca temporal cronológica (de más antiguo a más reciente)
    suplentes.sort(function (a, b) {
      return parsearTimestampAdmin(a.timestamp, a.timestampMs) - parsearTimestampAdmin(b.timestamp, b.timestampMs);
    });

    const pagados = lista.filter(function (j) { return String(j.pago || '').trim().toLowerCase() === 'pagado'; }).length;

    document.getElementById('adminTitularesCount').innerText = titulares.length;
    document.getElementById('adminSuplentesCount').innerText = suplentes.length;
    document.getElementById('adminBajasCount').innerText = bajas.length;
    document.getElementById('adminPagadosCount').innerText = pagados;

    document.getElementById('adminTitularesBadge').innerText = titulares.length;
    document.getElementById('adminSuplentesBadge').innerText = suplentes.length;
    document.getElementById('adminBajasBadge').innerText = bajas.length;

    tbodyTitulares.innerHTML = titulares.length > 0
      ? titulares.map(function (j) { return construirFilaTablaAdmin(j, false); }).join('')
      : '<tr><td colspan="6" style="text-align: center; padding: 18px; color: var(--text-muted);">No hay socios titulares registrados en Usuarios.</td></tr>';

    tbodySuplentes.innerHTML = suplentes.length > 0
      ? suplentes.map(function (j) { return construirFilaTablaAdmin(j, true); }).join('')
      : '<tr><td colspan="7" style="text-align: center; padding: 18px; color: var(--text-muted);">No hay suplentes en lista de espera.</td></tr>';

    tbodyBajas.innerHTML = bajas.length > 0
      ? bajas.map(function (j) { return construirFilaTablaAdmin(j, false); }).join('')
      : '<tr><td colspan="6" style="text-align: center; padding: 18px; color: var(--text-muted);">No hay bajas definitivas registradas.</td></tr>';
  }

  function cargarEscrutinioDelCiclo() {
    if (!tieneAppsScript()) return;
    const metaLbl = document.getElementById('scrutinyMetaText');
    const hitsLbl = document.getElementById('scrutinyHitsText');
    if (metaLbl) metaLbl.innerText = 'Consultando apuesta activa y consenso oficial SELAE / Prensa / RTVE...';
    if (hitsLbl) hitsLbl.innerText = 'Calculando aciertos del ciclo...';

    google.script.run
      .withSuccessHandler(function (res) {
        renderizarEscrutinioDelCiclo(res);
      })
      .withFailureHandler(function (err) {
        if (metaLbl) metaLbl.innerText = 'Error al consultar escrutinio: ' + (err.message || err);
        if (hitsLbl) hitsLbl.innerText = 'No se pudo obtener el escrutinio automático.';
      })
      .obtenerEscrutinioDelCiclo();
  }

  function renderizarEscrutinioDelCiclo(res) {
    const metaLbl = document.getElementById('scrutinyMetaText');
    const winBalls = document.getElementById('scrutinyWinningBalls');
    const winExtra = document.getElementById('scrutinyWinningExtra');
    const penaBalls = document.getElementById('scrutinyPenaBalls');
    const penaExtra = document.getElementById('scrutinyPenaExtra');
    const hitsLbl = document.getElementById('scrutinyHitsText');
    const savedBadge = document.getElementById('scrutinySavedPrizeBadge');
    const inputPremio = document.getElementById('inputPremioManual');

    // Siempre vacío por defecto para entrada manual del administrador
    if (inputPremio) inputPremio.value = '';

    if (!res || !res.success) {
      if (metaLbl) metaLbl.innerText = (res && res.message) || 'Sin datos de escrutinio disponibles.';
      if (hitsLbl) hitsLbl.innerText = (res && res.textoAciertos) || 'Escrutinio pendiente';
      return;
    }

    if (metaLbl) {
      metaLbl.innerText = (res.nombreSorteo || 'La Primitiva') + ' · Fecha: ' + (res.fechaSorteo || '-') +
        ' · Ciclo ' + (res.ciclo || 1) + ' (Jornada ' + (res.jornada || 1) + ')';
    }

    if (winBalls) {
      if (res.consensoDisponible && Array.isArray(res.combinacionGanadora) && res.combinacionGanadora.length === 6) {
        winBalls.innerHTML = res.combinacionGanadora.map(function (n) {
          const s = n < 10 ? '0' + n : String(n);
          return '<div class="ball tabular-nums">' + s + '</div>';
        }).join('');
        if (winExtra) {
          winExtra.innerText = 'Complementario: ' + (res.complementario !== null ? res.complementario : '-') +
            ' · Reintegro: ' + (res.reintegroGanador !== null ? res.reintegroGanador : '-') +
            (res.fuentesConsenso && res.fuentesConsenso.length ? ' (Consenso: ' + res.fuentesConsenso.join(' + ') + ')' : '');
        }
      } else {
        winBalls.innerHTML = '<span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">' +
          escapeHtml(res.mensajeConsenso || 'Combinación ganadora aún no disponible por consenso.') + '</span>';
        if (winExtra) winExtra.innerText = 'Pendiente de publicación oficial para este sorteo.';
      }
    }

    if (penaBalls) {
      if (Array.isArray(res.apuestaPena) && res.apuestaPena.length > 0) {
        const acertadosSet = Array.isArray(res.aciertosNumeros) ? res.aciertosNumeros : [];
        penaBalls.innerHTML = res.apuestaPena.map(function (n) {
          const s = n < 10 ? '0' + n : String(n);
          const esAcierto = acertadosSet.indexOf(n) !== -1;
          return '<div class="ball tabular-nums ' + (esAcierto ? 'ball-hit' : 'ball-muted') + '">' + s + '</div>';
        }).join('');
        if (penaExtra) {
          penaExtra.innerText = 'Reintegro jugado: ' + (res.reintegroJugado !== null && res.reintegroJugado !== undefined ? res.reintegroJugado : 'No asignado') +
            ' · Origen: ' + (res.origenApuesta || 'Sheets');
        }
      } else {
        penaBalls.innerHTML = '<span style="font-size: 0.88rem; color: var(--text-muted);">No hay apuesta activa registrada en «Apuestas Activas» ni «Sorteos».</span>';
        if (penaExtra) penaExtra.innerText = 'Añade la combinación jugada en la pestaña "Apuestas Activas" o "Sorteos".';
      }
    }

    if (hitsLbl) {
      hitsLbl.innerText = res.textoAciertos || 'Aciertos: 0 números';
    }
    if (savedBadge) {
      savedBadge.innerText = (res.premioGuardado !== null && res.premioGuardado !== undefined)
        ? ('Premio registrado actualmente: ' + formatearMoneda(res.premioGuardado))
        : '';
    }
  }

  function guardarPremioManual() {
    if (!tieneAppsScript()) return;
    const input = document.getElementById('inputPremioManual');
    const raw = input ? String(input.value || '').trim() : '';
    if (!raw) {
      mostrarToast('Introduce el importe oficial del premio en euros antes de guardar.', 'error');
      if (input) input.focus();
      return;
    }

    const cantidad = parseFloat(raw.replace(',', '.'));
    if (isNaN(cantidad) || cantidad < 0) {
      mostrarToast('El importe del premio debe ser numérico (>= 0).', 'error');
      return;
    }

    mostrarCargando(true, 'Guardando premio oficial en la base de datos...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message || 'Premio guardado correctamente.', 'success');
          if (input) input.value = '';
          const savedBadge = document.getElementById('scrutinySavedPrizeBadge');
          if (savedBadge) {
            savedBadge.innerText = 'Premio registrado actualmente: ' + formatearMoneda(res.cantidad);
          }
        } else {
          mostrarToast((res && res.message) || 'No se pudo guardar el premio.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al guardar el premio: ' + (err.message || err), 'error');
      })
      .guardarPremioManual(cantidad);
  }

  function cambiarEstadoPagoAdmin(fila, nuevoEstado) {
    if (!ESTADO_APP.adminPassword || !tieneAppsScript()) return;
    mostrarCargando(true, 'Actualizando pago...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
          recargarListaAdmin();
        } else {
          mostrarToast((res && res.error) || 'No se pudo actualizar el pago.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .actualizarEstadoPagoAdmin(fila, nuevoEstado, ESTADO_APP.adminPassword);
  }

  function ejecutarSaltoDeNivel() {
    if (!ESTADO_APP.adminPassword || !tieneAppsScript()) return;
    mostrarCargando(true, 'Evaluando lista de espera y saltos de nivel...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
          recargarListaAdmin();
        } else {
          mostrarToast((res && res.error) || 'No se cumplen los requisitos de cupo.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .aprobarSaltoDeNivelAdmin(ESTADO_APP.adminPassword);
  }

  function handleOverrideSubmit(event) {
    if (event) event.preventDefault();
    if (!tieneAppsScript()) return;
    const nums = document.getElementById('overrideNums').value.trim();
    const comp = document.getElementById('overrideComp').value;
    const reint = document.getElementById('overrideReint').value;

    mostrarCargando(true, 'Procesando escrutinio manual...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
        } else {
          mostrarToast((res && res.message) || 'Error en escrutinio manual.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .forzarResultadosManuales(nums, comp, reint);
  }

  function salirDeAdmin() {
    ESTADO_APP.adminPassword = '';
    if (ESTADO_APP.usuario) {
      cambiarVista('viewDashboard');
    } else {
      cambiarVista('viewLogin');
    }
  }

  function cerrarSesion() {
    ESTADO_APP.usuario = null;
    ESTADO_APP.adminPassword = '';
    const input = document.getElementById('inputUserDni');
    if (input) input.value = '';
    cambiarVista('viewLogin');
  }
</script>
