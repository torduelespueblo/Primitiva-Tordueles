<script>
  /**
   * ==========================================================================
   * PEÑA PRIMITIVA TORDUELES - CONTROLADOR FRONTEND SPA (JavaScript Puro)
   * Archivo: Logica.html
   * ==========================================================================
   * Cumplimiento estricto RGPD: no contiene datos sensibles ni credenciales.
   */

  const ESTADO_APP = {
    usuario: null,
    adminPassword: '',
    modoCaptacionInicial: false,
    calcShowAll: false,
    ultimoConteoTitulares: 0,
    ultimoConteoSuplentes: 0,
    metodoPagoSeleccionado: 'Bizum',
    ultimaJornadaInfo: null
  };

  (function initSplashScreen() {
    var SPLASH_DURATION_MS = 2000;
    window.setTimeout(function () {
      document.documentElement.classList.remove('splash-locked');
      if (document.body) {
        document.body.classList.remove('splash-locked');
      }
      var splash = document.getElementById('pwaSplashScreen');
      if (!splash) return;
      splash.classList.add('is-hidden');
      splash.setAttribute('aria-hidden', 'true');
      window.setTimeout(function () {
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 600);
    }, SPLASH_DURATION_MS);
  })();

  function cambiarVista(viewId) {
    document.querySelectorAll('.view-section').forEach(function (sec) {
      sec.classList.remove('active');
    });
    const destino = document.getElementById(viewId);
    if (destino) {
      destino.classList.add('active');
    }

    const btnSalir = document.getElementById('btnCerrarSesion');
    if (btnSalir) {
      btnSalir.style.display = (viewId === 'viewDashboard' || viewId === 'viewAdminPanel') ? 'inline-flex' : 'none';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function mostrarCargando(activo, texto) {
    const overlay = document.getElementById('loadingOverlay');
    const lbl = document.getElementById('loadingMessage');
    if (lbl && texto) lbl.innerText = texto;
    if (overlay) {
      if (activo) overlay.classList.add('active');
      else overlay.classList.remove('active');
    }
  }

  function mostrarToast(mensaje, tipo) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const item = document.createElement('div');
    item.className = 'toast-item' + (tipo ? ' ' + tipo : '');
    item.innerText = mensaje;
    container.appendChild(item);
    setTimeout(function () {
      if (item.parentNode) item.parentNode.removeChild(item);
    }, 4500);
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatearMoneda(valor) {
    const num = parseFloat(valor) || 0;
    return num.toLocaleString('es-ES', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + ' €';
  }

  function tieneAppsScript() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  // ==========================================================================
  // 1. MÓDULO 1: PANTALLA DUAL (LOGIN / TRANSICIÓN FLUIDA A REGISTRO)
  // ==========================================================================

  function handleLoginSubmit(event) {
    if (event) event.preventDefault();
    const input = document.getElementById('inputUserDni');
    const dni = (input ? input.value : '').trim().toUpperCase().replace(/[\s-]/g, '');

    if (!dni) {
      mostrarToast('Introduce tu DNI o NIE para acceder.', 'error');
      return;
    }

    mostrarCargando(true, 'Comprobando tu DNI o NIE en la base de datos...');

    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.user) {
            ESTADO_APP.usuario = res.user;
            cargarDashboardCompleto(res.user.dni);
          } else if (res && res.baja) {
            mostrarCargando(false);
            mostrarToast(res.message || 'Usuario en estado de baja.', 'error');
          } else {
            mostrarCargando(false);
            abrirFormularioRegistro();
          }
        })
        .withFailureHandler(function (err) {
          mostrarCargando(false);
          mostrarToast('Error de conexión: ' + (err.message || err), 'error');
        })
        .validarLoginDNI(dni);
      return;
    }

    setTimeout(function () {
      mostrarCargando(false);
      abrirFormularioRegistro();
    }, 300);
  }

  function abrirFormularioRegistro() {
    cambiarVista('viewRegister');
    validarFormularioRegistro();
  }

  function volverALogin() {
    cambiarVista('viewLogin');
    const input = document.getElementById('inputUserDni');
    if (input) {
      input.focus();
      input.select();
    }
  }

  function validarFormularioRegistro() {
    const nombre = (document.getElementById('regNombre')?.value || '').trim();
    const apellidos = (document.getElementById('regApellidos')?.value || '').trim();
    const telefono = (document.getElementById('regTelefono')?.value || '').trim();
    const chk = document.getElementById('chkAcceptRules');
    const btn = document.getElementById('btnSubmitRegistro');
    if (btn) {
      btn.disabled = !(nombre.length > 0 && apellidos.length > 0 && telefono.length >= 6 && chk && chk.checked);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    ['regNombre', 'regApellidos', 'regTelefono'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', validarFormularioRegistro);
    });
  });

  function handleRegisterSubmit(event) {
    if (event) event.preventDefault();
    const nombre = document.getElementById('regNombre').value.trim();
    const apellidos = document.getElementById('regApellidos').value.trim();
    const telefono = document.getElementById('regTelefono').value.trim();
    const aceptado = document.getElementById('chkAcceptRules').checked;

    if (!aceptado) {
      mostrarToast('Debes aceptar el Reglamento Oficial para continuar.', 'error');
      return;
    }

    const datos = {
      nombre: nombre,
      apellidos: apellidos,
      telefono: telefono,
      reglamentoAceptado: true
    };

    mostrarCargando(true, 'Registrando solicitud en la lista de espera...');

    if (tieneAppsScript()) {
      google.script.run
        .withSuccessHandler(function (res) {
          mostrarCargando(false);
          if (res && res.success) {
            ESTADO_APP.usuario = res.user;
            mostrarToast('Alta completada como Suplente #' + res.posicionEspera + ' (' + res.timestamp + ').', 'success');
            cargarDashboardCompleto('');
          } else {
            mostrarToast((res && res.message) || 'No se pudo completar el registro.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          mostrarCargando(false);
          mostrarToast('Error en el servidor: ' + (err.message || err), 'error');
        })
        .registrarNuevoJugadorDesdeWeb(datos);
      return;
    }

    setTimeout(function () {
      mostrarCargando(false);
      mostrarToast('El alta requiere conexión activa con el servidor de Google Apps Script.', 'error');
    }, 250);
  }

  // ==========================================================================
  // 2. MÓDULO 2: GENERACIÓN DE PDF PROFESIONAL (html2pdf.js) Y REGLAMENTO HTML
  // ==========================================================================

  function obtenerLogoPdfRgba() {
    try {
      const img = document.querySelector('.pdf-doc-header img') || document.querySelector('img[alt*="Tordueles"]');
      if (img && img.complete && img.naturalWidth > 0) {
        const canvas = document.createElement('canvas');
        canvas.width = 192;
        canvas.height = 192;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.fillStyle = '#0A2540';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL('image/png');
        }
      }
      if (img && img.src && img.src.indexOf('data:image/png') === 0) {
        return img.src;
      }
    } catch (_) {
      // Continuar sin bloquear la descarga si el lienzo falla
    }
    return null;
  }

  function descargarReglamentoPDF() {
    const sourceRules = document.getElementById('rulesScrollContainer');
    if (!sourceRules) return;

    const jspdfLib = window.jspdf && window.jspdf.jsPDF;
    if (!jspdfLib) {
      mostrarToast('No se pudo cargar el generador PDF. Usa el enlace HTML inferior.', 'error');
      return;
    }

    try {
      const doc = new jspdfLib({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 17;
      const contentWidth = pageWidth - marginX * 2;
      const bottomLimit = pageHeight - 18;

      doc.setFillColor(10, 37, 64);
      doc.rect(0, 0, pageWidth, 38, 'F');
      doc.setFillColor(255, 107, 0);
      doc.rect(0, 38, pageWidth, 1.8, 'F');

      const logoDataUri = obtenerLogoPdfRgba();
      let headerTextX = marginX;
      if (logoDataUri) {
        try {
          doc.addImage(logoDataUri, 'PNG', marginX, 5, 28, 28);
          headerTextX = marginX + 33;
        } catch (_) {
          headerTextX = marginX;
        }
      }

      doc.setTextColor(255, 107, 0);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.text('DOCUMENTO OFICIAL VINCULANTE', headerTextX, 12.5);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.text('Peña La Primitiva Tordueles', headerTextX, 20.5);

      doc.setTextColor(226, 232, 240);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text('Reglamento Oficial de la Peña Primitiva Tordueles · Tordueles (Burgos)', headerTextX, 28);

      let y = 48;
      let articleCount = 0;
      const ensureSpace = function (h) {
        if (y + h > bottomLimit) {
          doc.addPage();
          y = 19;
        }
      };

      const nodes = sourceRules.querySelectorAll('h4, p, li');
      nodes.forEach(function (el) {
        const tag = el.tagName.toUpperCase();
        const txt = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
        if (!txt) return;

        if (tag === 'H4') {
          if (articleCount > 0) {
            ensureSpace(30);
            if (y > 24) {
              doc.setDrawColor(226, 232, 240);
              doc.setLineWidth(0.35);
              doc.line(marginX, y + 0.5, pageWidth - marginX, y + 0.5);
              y += 6;
            }
          } else {
            ensureSpace(26);
          }
          articleCount++;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(13.5);
          doc.setTextColor(10, 37, 64);
          const lines = doc.splitTextToSize(txt, contentWidth);
          doc.text(lines, marginX, y);
          y += lines.length * 6.0 + 1.5;

          doc.setDrawColor(255, 107, 0);
          doc.setLineWidth(0.7);
          doc.line(marginX, y, marginX + 28, y);
          y += 5.0;
        } else if (el.closest('.rules-table-box') !== null) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10.8);
          const bulletLines = doc.splitTextToSize(txt, contentWidth - 8);
          const bLineHeight = 5.1;
          ensureSpace(bulletLines.length * bLineHeight + 2.0);
          doc.setFillColor(255, 107, 0);
          doc.circle(marginX + 3.2, y - 1.3, 0.9, 'F');
          doc.setTextColor(15, 23, 42);
          doc.text(bulletLines, marginX + 8, y);
          y += bulletLines.length * bLineHeight + 2.0;
        } else {
          const firstEl = el.firstElementChild;
          const strongEl = firstEl && firstEl.tagName === 'STRONG' ? firstEl : null;
          const strongTxt = strongEl ? (strongEl.innerText || strongEl.textContent || '').replace(/\s+/g, ' ').trim() : '';
          const bodyFontSize = 11.5;
          const lineHeight = 5.45;

          if (strongTxt && txt.indexOf(strongTxt) === 0) {
            const restTxt = txt.slice(strongTxt.length).trim();
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(bodyFontSize);
            const headingLines = doc.splitTextToSize(strongTxt, contentWidth);
            ensureSpace(headingLines.length * lineHeight + lineHeight * 2 + 2);
            doc.setTextColor(10, 37, 64);
            doc.text(headingLines, marginX, y);
            y += headingLines.length * lineHeight + 0.6;

            if (restTxt) {
              doc.setFont('helvetica', 'normal');
              doc.setFontSize(bodyFontSize);
              doc.setTextColor(30, 41, 59);
              const bodyLines = doc.splitTextToSize(restTxt, contentWidth);
              bodyLines.forEach(function (line) {
                ensureSpace(lineHeight + 1.2);
                doc.text(line, marginX, y);
                y += lineHeight;
              });
            }
            y += 2.8;
          } else {
            const isSubIntro = tag === 'P' && (
              txt.indexOf('bloques oficiales de apuestas múltiples') !== -1 ||
              txt.indexOf('opciones de apuestas') !== -1
            );
            doc.setFont('helvetica', isSubIntro ? 'bold' : 'normal');
            doc.setFontSize(isSubIntro ? 11 : bodyFontSize);
            doc.setTextColor(isSubIntro ? 51 : 30, isSubIntro ? 65 : 41, isSubIntro ? 85 : 59);
            const introLineHeight = isSubIntro ? 5.2 : lineHeight;
            const lines = doc.splitTextToSize(txt, contentWidth);
            lines.forEach(function (line) {
              ensureSpace(introLineHeight + 1.2);
              doc.text(line, marginX, y);
              y += introLineHeight;
            });
            y += isSubIntro ? 2.0 : 2.8;
          }
        }
      });

      const totalPages = doc.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(100, 116, 139);
        doc.text('Peña La Primitiva Tordueles · Reglamento Oficial', marginX, pageHeight - 8);
        doc.text('Página ' + p + ' de ' + totalPages, pageWidth - marginX, pageHeight - 8, { align: 'right' });
      }

      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Reglamento_Oficial_Pena_Primitiva_Tordueles.pdf';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2000);
      mostrarToast('Reglamento descargado en PDF (' + totalPages + ' páginas).', 'success');
    } catch (err) {
      mostrarToast('Error al generar el PDF: ' + (err.message || err), 'error');
    }
  }

  function abrirModalReglamentoHtml(event) {
    if (event) event.preventDefault();
    const source = document.getElementById('rulesScrollContainer');
    const modalBody = document.getElementById('htmlRulesModalBody');
    const modal = document.getElementById('htmlRulesModal');
    if (source && modalBody && modal) {
      modalBody.innerHTML = source.innerHTML;
      modal.classList.add('active');
    }
  }

  function cerrarModalReglamentoHtml() {
    const modal = document.getElementById('htmlRulesModal');
    if (modal) modal.classList.remove('active');
  }

  // ==========================================================================
  // 3. MÓDULO 3 & 5: DASHBOARD, BANNER NARANJA Y CENSO PÚBLICO RGPD
  // ==========================================================================

  function cargarDashboardCompleto(dni) {
    mostrarCargando(true, 'Cargando datos oficiales de la peña...');

    if (!tieneAppsScript()) {
      mostrarCargando(false);
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (!res || !res.success) {
          mostrarToast((res && res.message) || 'No se pudieron cargar los datos.', 'error');
          return;
        }
        if (res.data.usuario) {
          ESTADO_APP.usuario = res.data.usuario;
        }
        renderizarDashboard(res.data);
        cambiarVista('viewDashboard');
        cargarBannerRenovacion();
        cargarListaPublicaJugadores();
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al cargar dashboard: ' + (err.message || err), 'error');
      })
      .obtenerDatosDashboard(dni);
  }

  function renderizarDashboard(data) {
    const user = ESTADO_APP.usuario || {};
    const tes = data.tesoreria || {};
    const jInfo = data.jornadaInfo || {};
    ESTADO_APP.modoCaptacionInicial = Boolean(data.modoCaptacionInicial);
    ESTADO_APP.ultimaJornadaInfo = jInfo;

    document.getElementById('dashBolsaPremios').innerText = formatearMoneda(tes.bolsaPremios);
    const adminBoteLbl = document.getElementById('adminBoteActualLabel');
    if (adminBoteLbl) adminBoteLbl.innerText = formatearMoneda(tes.bolsaPremios);
    const adminSemanalLbl = document.getElementById('adminSemanalActualLabel');
    if (adminSemanalLbl) adminSemanalLbl.innerText = formatearMoneda(tes.gananciaSemanal || 0);
    const inputBote = document.getElementById('inputBotePremios');
    if (inputBote && !inputBote.value) {
      inputBote.value = (parseFloat(tes.bolsaPremios) || 0).toFixed(2);
    }
    const inputSemanal = document.getElementById('inputGananciaSemanal');
    if (inputSemanal && !inputSemanal.value) {
      inputSemanal.value = (parseFloat(tes.gananciaSemanal) || 0).toFixed(2);
    }
    document.getElementById('dashNombreUsuario').innerText = user.nombreCompleto || 'Socio en Alta';
    document.getElementById('dashDniUsuario').innerText = user.dni ? ('DNI: ' + user.dni) : 'Pendiente de asignación de DNI';
    document.getElementById('dashCondicion').innerText = ESTADO_APP.modoCaptacionInicial
      ? 'Inscrito'
      : (user.estado || 'Suplente');
    document.getElementById('dashPago').innerText = user.estadoPago || user.pago || 'Pendiente';
    document.getElementById('dashCiclo').innerText = 'Ciclo ' + (jInfo.cicloActual || user.cicloActual || 1) + ' · J' + (jInfo.jornadaEnCiclo || 1);
    document.getElementById('dashParticipacion').innerText = user.porcentajeParticipacion || '0.00%';

    const btnWa = document.getElementById('btnWhatsappRenovacion');
    if (btnWa) {
      const msg = encodeURIComponent(
        'Peña Primitiva Tordueles - Confirmo el abono de renovación de 10 € (Ciclo ' +
        (jInfo.cicloActual || 1) + '). Socio: ' + (user.nombreCompleto || 'Nuevo Socio')
      );
      btnWa.href = 'https://api.whatsapp.com/send?text=' + msg;
    }

    actualizarBannerRenovacionUI(jInfo);

    const cardBoleto = document.getElementById('cardApuestaActiva');
    const multiWrap = document.getElementById('dashBoletosMultiContainer');
    const titleEl = document.getElementById('dashBoletoTitle');
    const jornadaEl = document.getElementById('dashJornadaBoleto');
    const boletosActivos = Array.isArray(data.boletosActivos) && data.boletosActivos.length > 0
      ? data.boletosActivos
      : (data.ultimoSorteo && data.ultimoSorteo.combinacionJugada ? [data.ultimoSorteo] : []);

    if (cardBoleto && multiWrap && boletosActivos.length > 0) {
      cardBoleto.style.display = 'block';
      const firstB = boletosActivos[0];
      if (titleEl) {
        titleEl.innerText = boletosActivos.length > 1
          ? ('Apuestas Oficiales en Juego (' + boletosActivos.length + ' resguardos)')
          : 'Apuesta Oficial en Juego';
      }
      if (jornadaEl) {
        jornadaEl.innerText = 'Jornada ' + firstB.jornada + ' · ' + firstB.fecha;
      }

      function inferirNombreModalidad(b, numsLen) {
        if (b && b.modalidad) return String(b.modalidad).trim();
        if (numsLen === 5) return 'Múltiple 44';
        if (numsLen === 7) return 'Múltiple 7';
        if (numsLen === 8) return 'Múltiple 8';
        if (numsLen === 9) return 'Múltiple 9';
        if (numsLen === 10) return 'Múltiple 10';
        if (numsLen === 11) return 'Múltiple 11';
        return numsLen + ' números';
      }

      multiWrap.innerHTML = boletosActivos.map(function (b, idx) {
        const nums = String(b.combinacionJugada || '').split(',').map(function (n) { return n.trim(); }).filter(Boolean);
        const modLabel = inferirNombreModalidad(b, nums.length);
        const ballsHtml = nums.map(function (num) {
          return '<div class="ball tabular-nums">' + (num.length === 1 ? '0' + num : num) + '</div>';
        }).join('');
        const reintHtml = (b.reintegro !== undefined && b.reintegro !== null && b.reintegro !== '')
          ? (' · Reintegro: ' + b.reintegro)
          : '';
        const fotoHtml = b.fotoResguardo
          ? '<div style="margin-top: 8px; text-align: center;"><img src="' + escapeHtml(b.fotoResguardo) + '" alt="Resguardo ' + (idx + 1) + '" style="max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--border-hairline);" /></div>'
          : '';
        return (
          '<div class="multi-ticket-item">' +
            (boletosActivos.length > 1
              ? '<div style="font-size: 0.78rem; font-weight: 800; color: var(--navy-deep); text-align: center;">Resguardo ' + (idx + 1) + ' — ' + escapeHtml(modLabel) + '</div>'
              : (modLabel ? '<div style="font-size: 0.74rem; font-weight: 700; color: var(--text-muted); text-align: center;">' + escapeHtml(modLabel) + '</div>' : '')) +
            '<div class="balls-row">' + ballsHtml + '</div>' +
            '<p style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Importe jugado: ' + formatearMoneda(b.importeJugado) + reintHtml + '</p>' +
            fotoHtml +
          '</div>'
        );
      }).join('');
    } else if (cardBoleto) {
      cardBoleto.style.display = 'none';
    }
  }

  function actualizarBannerRenovacionUI(info) {
    const banner = document.getElementById('renewalOrangeBanner');
    const titleEl = document.getElementById('renewalBannerTitle');
    const txt = document.getElementById('renewalBannerText');
    const btnNotif = document.getElementById('btnNotificarPagoSocio');
    const badgeNotif = document.getElementById('badgePagoNotificadoLocked');
    const badgeConfirm = document.getElementById('badgeRenovacionConfirmada');
    const btnWa = document.getElementById('btnWhatsappRenovacion');
    if (!banner || !txt) return;

    const user = ESTADO_APP.usuario || {};
    const pagoRaw = String(user.estadoPago || user.pago || '').trim();
    const pagoLower = pagoRaw.toLowerCase();
    const esPagado = pagoLower === 'pagado';
    const esNotificado = pagoLower.indexOf('notificado') === 0;
    const esPendiente = pagoLower === 'pendiente' || (!esPagado && !esNotificado && Boolean(user.nombreCompleto));
    const esPeriodoRenovacion = Boolean(info && info.esPeriodoRenovacion);

    const mostrarBanner = esPeriodoRenovacion || esNotificado || esPendiente;
    if (!mostrarBanner) {
      banner.classList.remove('visible', 'confirmed');
      return;
    }

    banner.classList.add('visible');

    if (esPagado && esPeriodoRenovacion) {
      banner.classList.add('confirmed');
      if (titleEl) titleEl.innerText = 'Estado de Renovación';
      txt.innerText = 'Tu cuota del próximo ciclo está verificada por el Administrador (Jornada ' + (info.jornadaEnCiclo || 7) + '/10).';
      if (btnNotif) btnNotif.style.display = 'none';
      if (badgeNotif) badgeNotif.style.display = 'none';
      if (badgeConfirm) badgeConfirm.style.display = 'inline-flex';
      if (btnWa) btnWa.style.display = 'none';
      return;
    }

    banner.classList.remove('confirmed');
    if (badgeConfirm) badgeConfirm.style.display = 'none';

    if (esPeriodoRenovacion) {

  function parsearTimestampAdmin(ts, tsMs) {
    if (typeof tsMs === 'number' && !isNaN(tsMs)) return tsMs;
    if (!ts) return Number.MAX_SAFE_INTEGER;
    const str = String(ts).trim();
    const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))?/);
    if (m) {
      const ms = m[7] ? parseInt((m[7] + '000').slice(0, 3), 10) : 0;
      return new Date(
        parseInt(m[3], 10),
        parseInt(m[2], 10) - 1,
        parseInt(m[1], 10),
        parseInt(m[4], 10),
        parseInt(m[5], 10),
        parseInt(m[6], 10),
        ms
      ).getTime();
    }
    const parsed = Date.parse(str);
    return isNaN(parsed) ? Number.MAX_SAFE_INTEGER : parsed;
  }

  function renderizarTablaAdmin(jugadores) {
    const tbodyTitulares = document.getElementById('adminTitularesBody');
    const tbodySuplentes = document.getElementById('adminSuplentesBody');
    const tbodyBajas = document.getElementById('adminBajasBody');
    if (!tbodyTitulares || !tbodySuplentes || !tbodyBajas) return;

    const lista = Array.isArray(jugadores) ? jugadores : [];
    const titulares = [];
    const suplentes = [];
    const bajas = [];

    lista.forEach(function (j) {
      const cat = normalizarEstadoSocio(j.estado);
      if (cat === 'TITULAR') titulares.push(j);
      else if (cat === 'BAJA') bajas.push(j);
      else suplentes.push(j);
    });

    // Ordenar estrictamente los Suplentes por su marca temporal cronológica (de más antiguo a más reciente)
    suplentes.sort(function (a, b) {
      return parsearTimestampAdmin(a.timestamp, a.timestampMs) - parsearTimestampAdmin(b.timestamp, b.timestampMs);
    });

    const pagados = lista.filter(function (j) { return String(j.pago || '').trim().toLowerCase() === 'pagado'; }).length;

    // Bandeja de validación rápida: filtrar avisos "Notificado (...)"
    const avisosPendientes = lista.filter(function (j) {
      return String(j.pago || '').trim().toLowerCase().indexOf('notificado') === 0;
    });
    const pendingBadge = document.getElementById('adminPendingPaymentsBadge');
    const pendingList = document.getElementById('adminPendingPaymentsList');
    if (pendingBadge) pendingBadge.innerText = avisosPendientes.length;
    if (pendingList) {
      if (avisosPendientes.length === 0) {
        pendingList.innerHTML = '<div style="margin-top: 10px; font-size: 0.84rem; font-weight: 600; color: var(--text-muted);">No hay avisos de pago pendientes de verificar en este momento.</div>';
      } else {
        pendingList.innerHTML = avisosPendientes.map(function (j) {
          const matchMetodo = String(j.pago || '').match(/\(([^)]+)\)/);
          const metodoElegido = matchMetodo ? matchMetodo[1] : String(j.pago || 'Notificado');

                '<div style="font-weight: 800; color: var(--navy-deep); font-size: 0.94rem;">' +
                  escapeHtml((j.nombre || '') + ' ' + (j.apellidos || '')) +
                '</div>' +
                '<div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">' +

              '</div>' +

  function generarCombinacionesBloques(totalInscritos) {
    const bloques = [
      { bets: 7, label: '7 (Múltiple 7)' },
      { bets: 28, label: '28 (Múltiple 8)' },
      { bets: 44, label: '44 (5 Fijos)' },
      { bets: 84, label: '84 (Múltiple 9)' },
      { bets: 210, label: '210 (Múltiple 10)' },
      { bets: 462, label: '462 (Múltiple 11)' }
    ];

    const byTotal = {};
    function registerCombo(parts) {
      const counts = {};
      let sum = 0;
      parts.forEach(function (p) {
        counts[p] = (counts[p] || 0) + 1;
        sum += p;
      });
      if (sum <= 0 || sum > 600) return;

      const sortedKeys = Object.keys(counts).map(Number).sort(function (a, b) { return b - a; });
      const desc = sortedKeys.map(function (k) {
        return counts[k] > 1 ? (k + ' × ' + counts[k]) : String(k);
      }).join(' + ');
      const totalTickets = parts.length;
      const existing = byTotal[sum];
      if (!existing || totalTickets < existing.ticketCount) {
        const diff = sum - totalInscritos;
        let status = 'WAITING';
        if (totalInscritos >= sum) status = 'READY';
        else if (diff <= 10 || (sum > 0 && diff / sum <= 0.15)) status = 'CLOSE';
        byTotal[sum] = {
          description: desc + (totalTickets === 1 ? ' (1 boleto)' : ' (' + totalTickets + ' boletos)'),
          totalPlayers: sum,
          ticketCount: totalTickets,
          diff: diff,
          status: status
        };
      }
    }

    bloques.forEach(function (b1) {
      registerCombo([b1.bets]);
      bloques.forEach(function (b2) {
        registerCombo([b1.bets, b2.bets]);
        bloques.forEach(function (b3) {
          if (b1.bets + b2.bets + b3.bets <= 300) {
            registerCombo([b1.bets, b2.bets, b3.bets]);
          }
        });
      });
    });

    const allList = Object.keys(byTotal).map(function (k) { return byTotal[k]; });
    allList.sort(function (a, b) { return a.totalPlayers - b.totalPlayers; });
    return allList;
  }

  function renderizarCalculadoraCombinaciones(titulares, suplentes) {
    const tbody = document.getElementById('adminCalcCombinationsBody');
    const badge = document.getElementById('calcTotalInscritosBadge');
    const totalInscritos = (parseInt(titulares, 10) || 0) + (parseInt(suplentes, 10) || 0);

    if (badge) {
      badge.innerText = totalInscritos + ' inscritos activos (' + titulares + ' Tit. + ' + suplentes + ' Sup.)';
    }
    if (!tbody) return;

    const all = generarCombinacionesBloques(totalInscritos);
    let rows = all;
    if (!ESTADO_APP.calcShowAll) {
      const ready = all.filter(function (c) { return c.status === 'READY'; }).slice(-3);
      const upcoming = all.filter(function (c) { return c.status !== 'READY'; }).slice(0, 7);
      rows = ready.concat(upcoming);
      if (rows.length === 0) rows = all.slice(0, 10);
    }

    tbody.innerHTML = rows.map(function (item) {
      let diffHtml = '';
      if (item.diff === 0) {
        diffHtml = '<span style="color: var(--success-fg); font-weight: 800;">Cupo exacto (0)</span>';
      } else if (item.diff < 0) {
        const sobran = Math.abs(item.diff);
        diffHtml = '<span style="color: var(--success-fg); font-weight: 700;">Sobran ' + sobran + (sobran === 1 ? ' jugador' : ' jugadores') + '</span>';
      } else {
        diffHtml = '<span style="color: var(--orange-hover); font-weight: 700;">Faltan ' + item.diff + (item.diff === 1 ? ' jugador' : ' jugadores') + '</span>';
      }

      let badgeHtml = '<span class="calc-status-badge waiting">⚪ En espera</span>';
      if (item.status === 'READY') {
        badgeHtml = '<span class="calc-status-badge ready">🟢 Listo para jugar</span>';
      } else if (item.status === 'CLOSE') {
        badgeHtml = '<span class="calc-status-badge close">🟡 Muy cerca</span>';
      }

      return (
        '<tr>' +
          '<td style="font-weight: 700; color: var(--navy-deep);">' + escapeHtml(item.description) + '</td>' +
          '<td class="tabular-nums" style="font-weight: 800;">' + item.totalPlayers + ' jugadores (' + item.totalPlayers + ' €)</td>' +
          '<td class="tabular-nums">' + diffHtml + '</td>' +
          '<td>' + badgeHtml + '</td>' +
        '</tr>'
      );
    }).join('');
  }

  function cargarEscrutinioDelCiclo() {
    if (!tieneAppsScript()) return;
    const metaLbl = document.getElementById('scrutinyMetaText');
    const hitsLbl = document.getElementById('scrutinyHitsText');
    if (metaLbl) metaLbl.innerText = 'Consultando apuesta activa y consenso oficial SELAE / Prensa / RTVE...';
    if (hitsLbl) hitsLbl.innerText = 'Calculando aciertos del ciclo...';

    google.script.run
      .withSuccessHandler(function (res) {
        renderizarEscrutinioDelCiclo(res);
      })
      .withFailureHandler(function (err) {
        if (metaLbl) metaLbl.innerText = 'Error al consultar escrutinio: ' + (err.message || err);
        if (hitsLbl) hitsLbl.innerText = 'No se pudo obtener el escrutinio automático.';
      })
      .obtenerEscrutinioDelCiclo();
  }

  function renderizarEscrutinioDelCiclo(res) {
    const metaLbl = document.getElementById('scrutinyMetaText');
    const winBalls = document.getElementById('scrutinyWinningBalls');
    const winExtra = document.getElementById('scrutinyWinningExtra');
    const penaBalls = document.getElementById('scrutinyPenaBalls');
    const penaExtra = document.getElementById('scrutinyPenaExtra');
    const hitsLbl = document.getElementById('scrutinyHitsText');
    const savedBadge = document.getElementById('scrutinySavedPrizeBadge');
    const inputPremio = document.getElementById('inputPremioManual');

    // Siempre vacío por defecto para entrada manual del administrador
    if (inputPremio) inputPremio.value = '';

    if (!res || !res.success) {
      if (metaLbl) metaLbl.innerText = (res && res.message) || 'Sin datos de escrutinio disponibles.';
      if (hitsLbl) hitsLbl.innerText = (res && res.textoAciertos) || 'Escrutinio pendiente';
      return;
    }

    if (metaLbl) {
      metaLbl.innerText = (res.nombreSorteo || 'La Primitiva') + ' · Fecha: ' + (res.fechaSorteo || '-') +
        ' · Ciclo ' + (res.ciclo || 1) + ' (Jornada ' + (res.jornada || 1) + ')';
    }

    if (winBalls) {
      if (res.consensoDisponible && Array.isArray(res.combinacionGanadora) && res.combinacionGanadora.length === 6) {
        winBalls.innerHTML = res.combinacionGanadora.map(function (n) {
          const s = n < 10 ? '0' + n : String(n);
          return '<div class="ball tabular-nums">' + s + '</div>';
        }).join('');
        if (winExtra) {
          winExtra.innerText = 'Complementario: ' + (res.complementario !== null ? res.complementario : '-') +
            ' · Reintegro: ' + (res.reintegroGanador !== null ? res.reintegroGanador : '-') +
            (res.fuentesConsenso && res.fuentesConsenso.length ? ' (Consenso: ' + res.fuentesConsenso.join(' + ') + ')' : '');
        }
      } else {
        winBalls.innerHTML = '<span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">' +
          escapeHtml(res.mensajeConsenso || 'Combinación ganadora aún no disponible por consenso.') + '</span>';
        if (winExtra) winExtra.innerText = 'Pendiente de publicación oficial para este sorteo.';
      }
    }

    if (penaBalls) {
      if (Array.isArray(res.apuestaPena) && res.apuestaPena.length > 0) {
        const acertadosSet = Array.isArray(res.aciertosNumeros) ? res.aciertosNumeros : [];
        penaBalls.innerHTML = res.apuestaPena.map(function (n) {
          const s = n < 10 ? '0' + n : String(n);
          const esAcierto = acertadosSet.indexOf(n) !== -1;
          return '<div class="ball tabular-nums ' + (esAcierto ? 'ball-hit' : 'ball-muted') + '">' + s + '</div>';
        }).join('');
        if (penaExtra) {
          penaExtra.innerText = 'Reintegro jugado: ' + (res.reintegroJugado !== null && res.reintegroJugado !== undefined ? res.reintegroJugado : 'No asignado') +
            ' · Origen: ' + (res.origenApuesta || 'Sheets');
        }
      } else {
        penaBalls.innerHTML = '<span style="font-size: 0.88rem; color: var(--text-muted);">No hay apuesta activa registrada en «Apuestas Activas» ni «Sorteos».</span>';
        if (penaExtra) penaExtra.innerText = 'Añade la combinación jugada en la pestaña "Apuestas Activas" o "Sorteos".';
      }
    }

    const multiListEl = document.getElementById('scrutinyPenaMultiList');
    if (multiListEl) {
      if (Array.isArray(res.detalleBoletos) && res.detalleBoletos.length > 1) {
        multiListEl.style.display = 'block';
        multiListEl.innerHTML = res.detalleBoletos.map(function (b, idx) {
          const hits = Array.isArray(b.aciertosNumeros) ? b.aciertosNumeros : [];
          const modB = b.modalidad ? (' — ' + escapeHtml(b.modalidad)) : '';
          const numsHtml = (b.apuestaPena || []).map(function (n) {
            const s = n < 10 ? '0' + n : String(n);
            const esAcierto = hits.indexOf(n) !== -1;
            return '<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:0.78rem;font-weight:800;border:1px solid ' +
              (esAcierto ? '#10B981;background:#065F46;color:#FFF;' : '#CBD5E1;background:#F1F5F9;color:#0A2540;') + '">' + s + '</span>';
          }).join(' ');
          return (
            '<div style="padding:10px 12px;border:1px solid var(--border-hairline);border-radius:10px;background:#FFF;margin-bottom:8px;">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:0.8rem;font-weight:800;color:var(--navy-deep);">' +
                '<span>Resguardo #' + (idx + 1) + modB + ' (R: ' + (b.reintegroJugado !== null && b.reintegroJugado !== undefined ? b.reintegroJugado : '-') + ')</span>' +
                '<span style="color:var(--orange-hover);">' + escapeHtml(b.textoAciertos || '') + '</span>' +
              '</div>' +
              '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + numsHtml + '</div>' +
            '</div>'
          );
        }).join('');
      } else {
        multiListEl.style.display = 'none';
        multiListEl.innerHTML = '';
      }
    }

    if (hitsLbl) {
      hitsLbl.innerText = res.textoAciertos || 'Aciertos: 0 números';
    }
    if (savedBadge) {
      savedBadge.innerText = (res.premioGuardado !== null && res.premioGuardado !== undefined)
        ? ('Premio registrado actualmente: ' + formatearMoneda(res.premioGuardado))
        : '';
    }
  }

  function guardarPremioManual() {
    if (!tieneAppsScript()) return;
    const input = document.getElementById('inputPremioManual');
    const raw = input ? String(input.value || '').trim() : '';
    if (!raw) {
      mostrarToast('Introduce el importe oficial del premio en euros antes de guardar.', 'error');
      if (input) input.focus();
      return;
    }

    const cantidad = parseFloat(raw.replace(',', '.'));
    if (isNaN(cantidad) || cantidad < 0) {
      mostrarToast('El importe del premio debe ser numérico (>= 0).', 'error');
      return;
    }

    mostrarCargando(true, 'Guardando premio oficial en la base de datos...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message || 'Premio guardado correctamente.', 'success');
          if (input) input.value = '';
          const savedBadge = document.getElementById('scrutinySavedPrizeBadge');
          if (savedBadge) {
            savedBadge.innerText = 'Premio registrado actualmente: ' + formatearMoneda(res.cantidad);
          }
        } else {
          mostrarToast((res && res.message) || 'No se pudo guardar el premio.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al guardar el premio: ' + (err.message || err), 'error');
      })
      .guardarPremioManual(cantidad);
  }

  function guardarBoteManual() {
    if (!tieneAppsScript()) return;
    const input = document.getElementById('inputBotePremios');
    const raw = input ? String(input.value || '').trim() : '';
    if (!raw) {
      mostrarToast('Introduce el importe acumulado del bote en euros antes de guardar.', 'error');
      if (input) input.focus();
      return;
    }

    const cantidad = parseFloat(raw.replace(',', '.'));
    if (isNaN(cantidad) || cantidad < 0) {
      mostrarToast('El importe del bote debe ser numérico (>= 0).', 'error');
      return;
    }

    mostrarCargando(true, 'Actualizando Bote de Premios en Tesorería...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message || 'Bote actualizado correctamente.', 'success');
          const nuevaBolsa = parseFloat(res.bolsaPremios);
          if (!isNaN(nuevaBolsa)) {
            const dashLbl = document.getElementById('dashBolsaPremios');
            if (dashLbl) dashLbl.innerText = formatearMoneda(nuevaBolsa);
            const adminLbl = document.getElementById('adminBoteActualLabel');
            if (adminLbl) adminLbl.innerText = formatearMoneda(nuevaBolsa);
            if (input) input.value = nuevaBolsa.toFixed(2);
          }
        } else {
          mostrarToast((res && res.message) || 'No se pudo actualizar el bote.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al actualizar el bote: ' + (err.message || err), 'error');
      })
      .actualizarBotePremios(cantidad, ESTADO_APP.adminPassword);
  }

  function guardarGananciaSemanalManual(modo) {
    if (!tieneAppsScript()) return;
    const input = document.getElementById('inputGananciaSemanal');
    const raw = input ? String(input.value || '').trim() : '';
    if (!raw) {
      mostrarToast('Introduce el importe de la ganancia semanal en euros.', 'error');
      if (input) input.focus();
      return;
    }

    const cantidad = parseFloat(raw.replace(',', '.'));
    if (isNaN(cantidad) || cantidad < 0) {
      mostrarToast('La ganancia semanal debe ser numérica (>= 0).', 'error');
      return;
    }

    mostrarCargando(true, modo === 'solo_semanal' ? 'Guardando ganancia semanal...' : 'Sumando ganancia semanal al Bote General...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message || 'Ganancia semanal actualizada.', 'success');
          const nuevaBolsa = parseFloat(res.bolsaPremios);
          const nuevoSemanal = parseFloat(res.gananciaSemanal);
          if (!isNaN(nuevaBolsa)) {
            const dashLbl = document.getElementById('dashBolsaPremios');
            if (dashLbl) dashLbl.innerText = formatearMoneda(nuevaBolsa);
            const adminLbl = document.getElementById('adminBoteActualLabel');
            if (adminLbl) adminLbl.innerText = formatearMoneda(nuevaBolsa);
            const inputBote = document.getElementById('inputBotePremios');
            if (inputBote) inputBote.value = nuevaBolsa.toFixed(2);
          }
          if (!isNaN(nuevoSemanal)) {
            const adminSemLbl = document.getElementById('adminSemanalActualLabel');
            if (adminSemLbl) adminSemLbl.innerText = formatearMoneda(nuevoSemanal);
            if (input) input.value = nuevoSemanal.toFixed(2);
          }
        } else {
          mostrarToast((res && res.message) || 'No se pudo guardar la ganancia semanal.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error al guardar la ganancia semanal: ' + (err.message || err), 'error');
      })
      .sumarGananciaSemanal(cantidad, modo || 'sumar', ESTADO_APP.adminPassword);
  }

  function cambiarEstadoPagoAdmin(fila, nuevoEstado) {
    if (!ESTADO_APP.adminPassword || !tieneAppsScript()) return;
    mostrarCargando(true, 'Actualizando pago...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
          recargarListaAdmin();
        } else {
          mostrarToast((res && res.error) || 'No se pudo actualizar el pago.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .actualizarEstadoPagoAdmin(fila, nuevoEstado, ESTADO_APP.adminPassword);
  }

  function ejecutarSaltoDeNivel() {
    if (!ESTADO_APP.adminPassword || !tieneAppsScript()) return;
    mostrarCargando(true, 'Evaluando lista de espera y saltos de nivel...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
          recargarListaAdmin();
        } else {
          mostrarToast((res && res.error) || 'No se cumplen los requisitos de cupo.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .aprobarSaltoDeNivelAdmin(ESTADO_APP.adminPassword);
  }

  function handleOverrideSubmit(event) {
    if (event) event.preventDefault();
    if (!tieneAppsScript()) return;
    const nums = document.getElementById('overrideNums').value.trim();
    const comp = document.getElementById('overrideComp').value;
    const reint = document.getElementById('overrideReint').value;

    mostrarCargando(true, 'Procesando escrutinio manual...');
    google.script.run
      .withSuccessHandler(function (res) {
        mostrarCargando(false);
        if (res && res.success) {
          mostrarToast(res.message, 'success');
        } else {
          mostrarToast((res && res.message) || 'Error en escrutinio manual.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        mostrarCargando(false);
        mostrarToast('Error: ' + (err.message || err), 'error');
      })
      .forzarResultadosManuales(nums, comp, reint);
  }

  function salirDeAdmin() {
    ESTADO_APP.adminPassword = '';
    if (ESTADO_APP.usuario) {
      cambiarVista('viewDashboard');
    } else {
      cambiarVista('viewLogin');
    }
  }

  function cerrarSesion() {
    ESTADO_APP.usuario = null;
    ESTADO_APP.adminPassword = '';
    const input = document.getElementById('inputUserDni');
    if (input) input.value = '';
    cambiarVista('viewLogin');
  }
</script>
